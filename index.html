<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>امتحان الشطرنج للأطفال | التسجيل</title>
  <meta name="description" content="امتحان مقالي في مبادئ الشطرنج للأطفال — سجّل اسمك وسنّك لتبدأ." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♟️</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page">
  <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

  <header class="site-header">
    <div class="container site-header__row">
      <div class="brand"><span class="brand__mark" aria-hidden="true">♟️</span> أكاديمية الشطرنج الصغيرة</div>
    </div>
  </header>

  <main id="main">
    <div class="container">
      <div class="card" style="max-width:560px;margin-inline:auto;">
        <h1 class="h1 text-center">امتحان الشطرنج 🏆</h1>
        <p class="lede text-center" style="margin-block:var(--space-3) var(--space-8);">
          قبل ما تبدأ، اكتب اسمك وسنّك عشان نعرف نسلّمك شهادتك بعد الامتحان.
        </p>

        <form id="registration-form" novalidate>
          <div class="field" id="field-name">
            <label for="full-name">الاسم الثلاثي</label>
            <input
              type="text"
              id="full-name"
              name="fullName"
              autocomplete="name"
              placeholder="مثال: يوسف عماد متي"
              aria-describedby="name-error"
              required
            />
            <p class="error-msg" id="name-error" role="alert">من فضلك اكتب اسمك الثلاثي كامل (3 كلمات على الأقل).</p>
          </div>

          <div class="field" id="field-age">
            <label for="age">السن</label>
            <input
              type="number"
              id="age"
              name="age"
              inputmode="numeric"
              min="4"
              max="99"
              placeholder="مثال: 9"
              aria-describedby="age-error"
              required
            />
            <p class="error-msg" id="age-error" role="alert">من فضلك اكتب سنّك بشكل صحيح.</p>
          </div>

          <button type="submit" class="btn btn--primary btn--block btn--lg" id="start-btn">
            ابدأ الامتحان
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">امتحان مقالي — ١٠ أسئلة — ٣٠ دقيقة</div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
